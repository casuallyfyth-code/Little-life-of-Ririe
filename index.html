<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my little life os 🌿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap');
  :root{
    --cream:#FBF6EE; --sage:#8FA681; --sage-dark:#5F7350;
    --rose:#D9A5A0; --butter:#EFC873; --sky:#A7C4C2;
    --brown:#6B4E3D; --line:#E4D9C4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(circle at 10% 8%, rgba(217,165,160,.15), transparent 40%),radial-gradient(circle at 90% 12%, rgba(143,166,129,.15), transparent 40%),var(--cream);font-family:'Quicksand',sans-serif;color:var(--brown);padding:26px 14px 70px;}
  .wrap{max-width:520px;margin:0 auto;}
  header{text-align:center;margin-bottom:24px;}
  header .sprig{font-size:26px;display:block;margin-bottom:4px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.8rem;margin:0;color:var(--sage-dark);}
  header p{font-style:italic;font-family:'Fraunces',serif;color:var(--rose);margin-top:5px;font-size:.88rem;}
  section{margin-bottom:18px;background:#FFFDF8;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 0 var(--line);}
  section h2{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;margin:0 0 8px;color:var(--sage-dark);}
  .tag{display:inline-block;color:#fff;font-size:.63rem;padding:3px 9px;border-radius:20px;margin-bottom:8px;font-weight:600;}
  .tag.school{background:var(--sky);} .tag.food{background:var(--rose);}
  .tag.habit{background:var(--sage);} .tag.org{background:var(--butter);color:var(--brown);}
  .tag.biz{background:#C9A66B;} .tag.wellness{background:var(--sage-dark);}
  .tag.misc{background:#B7AFC7;}

  .task{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line);}
  .task:last-child{border-bottom:none;}
  .task input[type=checkbox]{width:19px;height:19px;accent-color:var(--sage);flex-shrink:0;}
  .task .txt{flex:1;font-size:.9rem;}
  .task .txt .due{display:block;font-size:.68rem;color:var(--rose);font-weight:600;}
  .task span.done{text-decoration:line-through;color:#b3a48c;}
  .del{background:none;border:none;color:var(--rose);font-size:1.1rem;cursor:pointer;padding:0 4px;}

  .addrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .addrow input[type=text]{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:'Quicksand';font-size:.85rem;background:#fff;}
  .addrow input[type=date]{border:1px solid var(--line);border-radius:10px;padding:8px 8px;font-family:'Quicksand';font-size:.78rem;background:#fff;color:var(--brown);}
  .addrow button{background:var(--sage);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.85rem;}

  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;flex:1;min-width:70px;}
  .stat .num{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--sage-dark);display:block;}
  .stat .lbl{font-size:.65rem;color:#9a8b78;}
  .navpill{background:var(--sage);color:#fff;font-size:.72rem;padding:5px 11px;border-radius:14px;text-decoration:none;font-weight:600;}

  .wellrow{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .wellrow label{font-size:.78rem;color:#9a8b78;}
  .wellrow input[type=number],.wellrow input[type=text]{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:'Quicksand';font-size:.88rem;}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:'Quicksand';font-size:.85rem;min-height:70px;resize:vertical;background:#fff9ef;}

  /* calendar */
  .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .calhead button{background:var(--sky);border:none;color:#28403e;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;}
  .calhead span{font-family:'Fraunces',serif;font-weight:600;color:var(--sage-dark);}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calgrid .dow{font-size:.62rem;text-align:center;color:#9a8b78;font-weight:700;padding-bottom:4px;}
  .calday{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer;position:relative;}
  .calday.empty{border:none;background:transparent;cursor:default;}
  .calday.today{border:2px solid var(--sage);font-weight:700;}
  .calday.selected{background:var(--sage);color:#fff;}
  .calday .dots{display:flex;gap:2px;margin-top:2px;}
  .calday .dot{width:5px;height:5px;border-radius:50%;}
  .dot.w{background:var(--rose);}
  .dot.t{background:var(--butter);}
  .dot.s{background:var(--sky);}

  .daypanel{margin-top:12px;background:#F6F9F2;border:1px solid var(--sage);border-radius:14px;padding:12px;}
  .daypanel h3{font-family:'Fraunces',serif;font-size:.95rem;margin:0 0 8px;color:var(--sage-dark);}

  .soft-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line);flex-wrap:wrap;}
  .soft-item:last-child{border-bottom:none;}
  .soft-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--sage);flex-shrink:0;}
  .soft-item .lbl2{flex:1;font-size:.87rem;min-width:140px;}
  .soft-item input[type=number]{width:60px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:.8rem;}
  .soft-item .unit{font-size:.72rem;color:#9a8b78;}
  .subgroup{margin-top:6px;}
  .subgroup .grouplabel{font-size:.75rem;color:#9a8b78;font-weight:600;margin:8px 0 2px;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;}
  .pillcheck{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.75rem;}

  footer{text-align:center;margin-top:30px;font-family:'Fraunces',serif;font-style:italic;color:var(--rose);font-size:.85rem;}

  /* desktop */
  @media (min-width:900px){
    body{padding:36px 24px 90px;}
    .wrap{max-width:1100px;}
    header{margin-bottom:32px;}
    #maingrid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
    #leftcol, #rightcol{display:flex;flex-direction:column;}
    #lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    #lists section{margin-bottom:0;}
  }
  @media (min-width:1300px){
    #lists{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sprig">🌿🍄🌾</span>
    <h1>my little life os</h1>
    <p>a soft little system for a whole life 🌾</p>
  </header>

  <div id="maingrid">
    <div id="leftcol">
      <section style="background:linear-gradient(135deg,#F6F9F2,#FDF3E7);border:1.5px solid var(--sage);">
        <span class="tag habit">dashboard</span>
        <h2>🌤️ Today at a Glance</h2>
        <div id="dash-stats" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;"></div>
        <div id="dash-nav" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;"></div>
        <div style="display:flex;gap:8px;">
          <button onclick="exportData()" style="background:var(--butter);color:var(--brown);border:none;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.78rem;">⬇️ Export</button>
          <label style="background:var(--sky);color:#28403e;border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.78rem;">
            ⬆️ Import<input type="file" accept=".json" onchange="importData(event)" style="display:none;">
          </label>
        </div>
      </section>

      <section>
        <span class="tag wellness">calendar</span>
        <h2>🗓️ Progress Calendar</h2>
        <div class="calhead">
          <button onclick="changeMonth(-1)">‹</button>
          <span id="cal-label"></span>
          <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="calgrid" id="cal-grid"></div>
        <div style="font-size:.65rem;color:#9a8b78;margin-top:6px;">🌸 rose = wellness logged · 💛 butter = task due · 💙 sky = 75 Soft logged</div>
        <div id="daypanel"></div>
      </section>

      <section>
        <span class="tag misc">quick capture</span>
        <h2>🍂 Braindump</h2>
        <textarea id="inbox" placeholder="anything on your mind..."></textarea>
      </section>
    </div>

    <div id="rightcol">
      <section id="sec-soft75">
        <span class="tag habit">gentle habits · resets daily</span>
        <h2>🌷 75 Soft — <span id="soft-date"></span></h2>
        <div id="soft-list"></div>
      </section>

      <div id="lists"></div>
    </div>
  </div>

  <footer>grow a little every day 🌱</footer>
</div>

<script>
const sections = [
  {id:'academic', tag:'school', title:'📖 Academic'},
  {id:'food', tag:'food', title:'🍓 Food Planning'},
  {id:'art', tag:'misc', title:'🎨 Art Practice'},
  {id:'orgs', tag:'org', title:'🎀 School Organizations'},
  {id:'invest', tag:'biz', title:'🌻 Investing & Savings'},
  {id:'business', tag:'biz', title:'💼 Business'},
  {id:'therapy', tag:'wellness', title:'🌙 Therapy / Psych'},
  {id:'budget', tag:'misc', title:'🍯 Budget & Saving'},
  {id:'misc', tag:'misc', title:'🧺 Miscellaneous'},
];

function todayStr(){ return new Date().toISOString().slice(0,10); }
function pad(n){ return String(n).padStart(2,'0'); }

// ---- tasks ----
function getTasks(id){ try{ return JSON.parse(localStorage.getItem('tasks:'+id)) || []; }catch(e){ return []; } }
function saveTasks(id, tasks){ localStorage.setItem('tasks:'+id, JSON.stringify(tasks)); }
function allTasksFlat(){
  let out = [];
  sections.forEach(sec => getTasks(sec.id).forEach((t,i) => out.push({...t, sectionId:sec.id, idx:i})));
  return out;
}
function renderTasks(id){
  const tasks = getTasks(id);
  const container = document.getElementById('list-'+id);
  container.innerHTML = tasks.map((t,i) => `
    <div class="task">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${id}',${i})">
      <span class="txt"><span class="${t.done?'done':''}">${t.text}</span>${t.due?`<span class="due">📅 ${t.due}</span>`:''}</span>
      <button class="del" onclick="deleteTask('${id}',${i})">×</button>
    </div>
  `).join('');
}
function addTask(id){
  const input = document.getElementById('input-'+id);
  const dateInput = document.getElementById('date-'+id);
  const val = input.value.trim();
  if(!val) return;
  const tasks = getTasks(id);
  tasks.push({text:val, done:false, due: dateInput.value || null});
  saveTasks(id, tasks);
  input.value = ''; dateInput.value = '';
  renderTasks(id); renderDashboard(); renderCalendar();
}
function toggleTask(id, idx){
  const tasks = getTasks(id);
  tasks[idx].done = !tasks[idx].done;
  saveTasks(id, tasks);
  renderTasks(id); renderDashboard(); renderCalendar();
  if(selectedDate) renderDayPanel(selectedDate);
}
function deleteTask(id, idx){
  const tasks = getTasks(id);
  tasks.splice(idx,1);
  saveTasks(id, tasks);
  renderTasks(id); renderDashboard(); renderCalendar();
  if(selectedDate) renderDayPanel(selectedDate);
}

const listsDiv = document.getElementById('lists');
sections.forEach(sec => {
  const el = document.createElement('section');
  el.id = 'sec-'+sec.id;
  el.innerHTML = `
    <span class="tag ${sec.tag}">${sec.tag}</span>
    <h2>${sec.title}</h2>
    <div class="tasklist" id="list-${sec.id}"></div>
    <div class="addrow">
      <input type="text" id="input-${sec.id}" placeholder="add a task...">
      <input type="date" id="date-${sec.id}">
      <button onclick="addTask('${sec.id}')">Add</button>
    </div>
  `;
  listsDiv.appendChild(el);
  renderTasks(sec.id);
});

// ---- wellness (per-date) ----
function getWellness(dateStr){ try{ return JSON.parse(localStorage.getItem('wellness:'+dateStr)) || {}; }catch(e){ return {}; } }
function saveWellness(dateStr, data){ localStorage.setItem('wellness:'+dateStr, JSON.stringify(data)); }

// ---- 75 Soft (per-date, fixed checklist) ----
const softItems = [
  {key:'sleep8', label:'Sleep 8 hours', tracked:true, unit:'hrs'},
  {key:'bible', label:'Read 10 pages of the Bible'},
  {key:'finance', label:'Learn finance for 1 hour', tracked:true, unit:'hrs'},
  {key:'deepwork', label:'Deep work / studies (goal: 5 hrs)', tracked:true, unit:'hrs'},
  {key:'nojunk', label:'No junk food or drinks'},
  {key:'exercise', label:'Exercise at least 45 min', tracked:true, unit:'min'},
  {key:'water', label:'Drink 3L water with DCTM', tracked:true, unit:'L'},
];
function getSoft(dateStr){ try{ return JSON.parse(localStorage.getItem('soft75:'+dateStr)) || {}; }catch(e){ return {}; } }
function saveSoft(dateStr, data){ localStorage.setItem('soft75:'+dateStr, JSON.stringify(data)); }

function renderSoftToday(){
  const dateStr = todayStr();
  document.getElementById('soft-date').textContent = dateStr;
  renderSoftInto('soft-list', dateStr);
}

function renderSoftInto(containerId, dateStr){
  const data = getSoft(dateStr);
  const container = document.getElementById(containerId);
  let html = '';
  softItems.forEach(item => {
    const checked = data[item.key+'_done'] ? 'checked' : '';
    const val = data[item.key+'_val'] ?? '';
    html += `<div class="soft-item">
      <input type="checkbox" ${checked} onchange="updateSoft('${dateStr}','${item.key}_done', this.checked, '${containerId}')">
      <span class="lbl2">${item.label}</span>
      ${item.tracked ? `<input type="number" step="0.1" placeholder="0" value="${val}" onchange="updateSoft('${dateStr}','${item.key}_val', this.value, '${containerId}')"><span class="unit">${item.unit}</span>` : ''}
    </div>`;
  });

  // Medication
  html += `<div class="subgroup"><div class="grouplabel">💊 Medication</div><div class="pillrow">
    <label class="pillcheck"><input type="checkbox" ${data.med_antidep?'checked':''} onchange="updateSoft('${dateStr}','med_antidep', this.checked, '${containerId}')"> Antidepressant</label>
    <label class="pillcheck"><input type="checkbox" ${data.med_antipsych?'checked':''} onchange="updateSoft('${dateStr}','med_antipsych', this.checked, '${containerId}')"> Antipsychotic</label>
  </div></div>`;

  // Vitamins — 3x/day each
  html += `<div class="subgroup"><div class="grouplabel">🌿 Essential Greens (2 tabs, 3x/day)</div><div class="pillrow">
    ${[1,2,3].map(n=>`<label class="pillcheck"><input type="checkbox" ${data['green_'+n]?'checked':''} onchange="updateSoft('${dateStr}','green_${n}', this.checked, '${containerId}')"> Meal ${n}</label>`).join('')}
  </div></div>`;
  html += `<div class="subgroup"><div class="grouplabel">🍊 Essential C (2 tabs, 3x/day)</div><div class="pillrow">
    ${[1,2,3].map(n=>`<label class="pillcheck"><input type="checkbox" ${data['vitc_'+n]?'checked':''} onchange="updateSoft('${dateStr}','vitc_${n}', this.checked, '${containerId}')"> Meal ${n}</label>`).join('')}
  </div></div>`;

  container.innerHTML = html;
}

function updateSoft(dateStr, key, value, containerId){
  const data = getSoft(dateStr);
  data[key] = value;
  saveSoft(dateStr, data);
  renderDashboard();
  renderCalendar();
}

// ---- dashboard ----
function renderDashboard(){
  let totalOpen = 0, totalDone = 0;
  sections.forEach(sec => {
    const tasks = getTasks(sec.id);
    totalOpen += tasks.filter(t=>!t.done).length;
    totalDone += tasks.filter(t=>t.done).length;
  });
  const w = getWellness(todayStr());
  const s = getSoft(todayStr());
  const softDoneCount = softItems.filter(i => s[i.key+'_done']).length;
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat"><span class="num">${totalOpen}</span><span class="lbl">open tasks</span></div>
    <div class="stat"><span class="num">${totalDone}</span><span class="lbl">done</span></div>
    <div class="stat"><span class="num">${softDoneCount}/${softItems.length}</span><span class="lbl">75 soft today</span></div>
    <div class="stat"><span class="num">${w.meals ?? '–'}</span><span class="lbl">meals today</span></div>
  `;
  document.getElementById('dash-nav').innerHTML = sections.map(sec =>
    `<a class="navpill" href="#sec-${sec.id}">${sec.title.split(' ')[0]}</a>`
  ).join('') + `<a class="navpill" href="#sec-soft75" style="background:var(--sage-dark);">🌷</a>`;
}

// ---- calendar ----
let calYear, calMonth, selectedDate = null;
(function initCal(){ const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth(); })();

function changeMonth(delta){
  calMonth += delta;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  renderCalendar();
}

function renderCalendar(){
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById('cal-label').textContent = `${monthNames[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid');
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const dows = ['S','M','T','W','T','F','S'];
  let html = dows.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++) html += `<div class="calday empty"></div>`;

  const flatTasks = allTasksFlat();
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const hasWellness = !!localStorage.getItem('wellness:'+dateStr);
    const hasTaskDue = flatTasks.some(t => t.due === dateStr);
    const hasSoft = !!localStorage.getItem('soft75:'+dateStr);
    const isToday = dateStr === todayStr();
    const isSelected = dateStr === selectedDate;
    let cls = 'calday';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    html += `<div class="${cls}" onclick="selectDate('${dateStr}')">${d}
      <div class="dots">${hasWellness?'<span class="dot w"></span>':''}${hasTaskDue?'<span class="dot t"></span>':''}${hasSoft?'<span class="dot s"></span>':''}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

function selectDate(dateStr){
  selectedDate = dateStr;
  renderCalendar();
  renderDayPanel(dateStr);
}

function renderDayPanel(dateStr){
  const w = getWellness(dateStr);
  const flatTasks = allTasksFlat().filter(t => t.due === dateStr);
  const panel = document.getElementById('daypanel');
  panel.innerHTML = `
    <div class="daypanel">
      <h3>${dateStr}</h3>
      <div class="wellrow"><label>Meals eaten</label><input type="number" id="pw-meals" min="0" max="6" value="${w.meals ?? ''}"></div>
      <div class="wellrow"><label>Sleep (hrs)</label><input type="number" id="pw-sleep" min="0" max="14" value="${w.sleep ?? ''}"></div>
      <div class="wellrow"><label>Anxiety (1–10)</label><input type="number" id="pw-anx" min="1" max="10" value="${w.anx ?? ''}"></div>
      <div class="wellrow"><label>How I felt</label><input type="text" id="pw-note" value="${w.note ?? ''}"></div>
      ${flatTasks.length ? `<div style="margin-top:8px;"><span style="font-size:.75rem;color:#9a8b78;">Tasks due this day:</span>${flatTasks.map(t=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.sectionId}',${t.idx})"><span class="txt"><span class="${t.done?'done':''}">${t.text}</span></span></div>`).join('')}</div>` : ''}
      <div style="margin-top:10px;"><span style="font-size:.75rem;color:#9a8b78;">75 Soft this day:</span></div>
      <div id="daypanel-soft"></div>
    </div>
  `;
  renderSoftInto('daypanel-soft', dateStr);
  ['pw-meals','pw-sleep','pw-anx','pw-note'].forEach(fid => {
    document.getElementById(fid).addEventListener('input', () => {
      const d = {
        meals: document.getElementById('pw-meals').value,
        sleep: document.getElementById('pw-sleep').value,
        anx: document.getElementById('pw-anx').value,
        note: document.getElementById('pw-note').value,
      };
      saveWellness(dateStr, d);
      renderDashboard();
      renderCalendar();
    });
  });
}

// braindump
const inbox = document.getElementById('inbox');
inbox.value = localStorage.getItem('inbox') || '';
inbox.addEventListener('input', () => localStorage.setItem('inbox', inbox.value));

renderSoftToday();
renderDashboard();
renderCalendar();
selectDate(todayStr());

// ---- export / import for cross-device sync ----
function exportData(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    data[key] = localStorage.getItem(key);
  }
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'life-os-backup-'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
      alert('Imported! Reloading your data now 🌿');
      location.reload();
    }catch(err){
      alert('Hmm, that file did not load right. Make sure it is a backup exported from this same planner.');
    }
  };
  reader.readAsText(file);
}
</script>
</body>
</html>
